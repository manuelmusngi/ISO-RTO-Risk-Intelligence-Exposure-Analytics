# Portfolio positions and static attributes

portfolio:
  name: "ACES Midcontinent Portfolio"
  book: "MIDCON_POWER"
  base_currency: "USD"

load:
  - id: "LOAD_ZONE_MISO_NORTH"
    iso: "MISO"
    zone: "MISO_NORTH"
    type: "load_obligation"
    peak_mw: 500
    shape: "residential_mixed"
    pricing_node: "NODE_MISO_NORTH_HUB"

  - id: "LOAD_ZONE_PJM_WEST"
    iso: "PJM"
    zone: "PJM_WEST"
    type: "load_obligation"
    peak_mw: 300
    shape: "industrial_mixed"
    pricing_node: "NODE_PJM_WEST_HUB"

generation:
  - id: "GEN_CC_MISO_01"
    iso: "MISO"
    plant_name: "MISO_CC_01"
    fuel: "gas"
    capacity_mw: 350
    min_mw: 100
    heat_rate_btu_per_kwh: 7200
    pricing_node: "NODE_MISO_CC_01"
    outage_class: "planned_forced"

  - id: "GEN_WIND_MISO_01"
    iso: "MISO"
    plant_name: "MISO_WIND_01"
