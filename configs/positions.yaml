    capacity_mw: 200
    min_mw: 0
    pricing_node: "NODE_MISO_WIND_01"
    outage_class: "intermittent"

bilateral_contracts:
  - id: "BILAT_MISO_2026Q1_01"
    iso: "MISO"
    direction: "sell"
    volume_mw: 150
    tenor: "2026-01-01_to_2026-03-31"
    hub: "MISO_NORTH_HUB"
    price_usd_per_mwh: 42.50
    product: "7x24"

  - id: "BILAT_PJM_2026Q1_01"
    iso: "PJM"
    direction: "buy"
    volume_mw: 100
    tenor: "2026-01-01_to_2026-03-31"
    hub: "PJM_WEST_HUB"
    price_usd_per_mwh: 45.00
    product: "5x16"

